name: Turkce Ses Denemesi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Piper kur
        run: python -m pip install piper-tts==1.3.0

      - name: Turkce modeli indir
        run: |
          mkdir -p voices output
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/36915ed3d066024c63841a1d20f29edcdbc37c14/tr/tr_TR/fettah/medium"
          curl -fL --retry 3 --max-time 300 "$BASE/tr_TR-fettah-medium.onnx" -o voices/fettah.onnx
          curl -fL --retry 3 --max-time 60 "$BASE/tr_TR-fettah-medium.onnx.json" -o voices/fettah.onnx.json

      - name: Deneme sesini uret
        run: |
          cat > metin.txt <<'TEXT'
          Merhaba minik dostlar! Ben Mino.
          Bugün Tosi ve Piko ile renkleri keşfedeceğiz.
          Bakın, ağacın yanında kırmızı bir top var!
          Siz de kırmızı topu görebiliyor musunuz?
          Haydi, arkadaşlarımızla birlikte yeni bir maceraya başlayalım!
          TEXT
          python -m piper \
            -m voices/fettah.onnx \
            -i metin.txt \
            -f output/ses-deneme.wav \
            --length-scale 1.05 \
            --sentence-silence 0.35

      - uses: actions/upload-artifact@v4
        with:
          name: turkce-ses-denemesi
          path: output/ses-deneme.wav
          retention-days: 1
          if-no-files-found: error
