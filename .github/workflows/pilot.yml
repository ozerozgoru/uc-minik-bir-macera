name: Uc Minik Bir Macera Pilot V4
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uc-minik-pilot
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Araclari kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ema-lightning Pillow==11.3.0
      - name: Pilot uret
        run: python render.py
      - uses: actions/upload-artifact@v4
        with:
          name: uc-minik-pilot-v4
          path: |
            output/pilot.mp4
            output/preview.jpg
          retention-days: 1
          if-no-files-found: error
